name: Báo lỗi khi chạy project
description: Ghi thông tin đủ để tái hiện lỗi kiểm thử, dữ liệu hoặc demo.
title: '[Bug] '
body:
  - type: input
    id: environment
    attributes:
      label: Môi trường
      description: Hệ điều hành cùng phiên bản Java, Python và Node.js nếu có.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Các bước tái hiện
      description: Ghi lệnh đã chạy hoặc thao tác trên demo.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi và kết quả thực tế
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log hoặc thông báo lỗi
      render: text
