name: Verify submission

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          overwrite-settings: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify repository checksums and navigation
        run: python tools/repository_check.py check

      - name: Test the supplied MergeSort
        run: python cutofflab.py test

      - name: Test statistical invariants
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test the interactive viewer
        run: node --test tests/test_viewer.cjs

      - name: Audit the recorded experiment
        run: python cutofflab.py verify

      - name: Confirm the preserved files remain unchanged
        run: python tools/repository_check.py check
